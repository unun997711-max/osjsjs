                  ],
              },
              'boss_dead': {
                  'lines': [
                      ('B', 'At last... the roots are quiet. Thank you, little sparks.'),
                      (0, 'The Rift is closing. Look, the forest is breathing again.'),
                  ],
              },
              'won': {
                  'chapter': 'THE FOREST AWAKENS',
                  'lines': [
                      ('N', 'Dawn light spills through the canopy. The Heartroot glows green once more.'),
                      (1, 'We did it.'),
                      (2, '...Now can we please eat something?'),
                      (3, 'This was only the first Rift, you know.'),
                      (0, 'Then our journey has only just begun.'),
                      ('N', 'THE END - to be continued...'),
                  ],
              },
              'lost': {
                  'lines': [
                      ('N', 'The light fades. The forest falls silent once more, and the Rift grows.'),
                  ],
              },
          }

          BARKS_DOWN = [
              'Hang on, we will get you back up!',
              'No! Hold the line!',
              'Somebody cover them!',
              'Stay with us!',
          ]

          class Story:
              CPS = 38.0                      # typewriter speed (chars per second)

              def __init__(s, is_host=False):
                  s.is_host = is_host
                  s.world = None
                  s.queue = []
                  s.cur = None
                  s.shown = 0.0
                  s.hold = 0.0
                  s.banner = None             # [chapter text, seconds left]
                  s.seen = set()

              # ----- build queue from world events -----
              def feed(s, world):
                  s.world = world
                  evs, world.events = world.events, []
                  for ev in evs:
                      if ev == 'down':
                          s.bark(world)
                          continue
                      sc = SCENES.get(ev)
                      if sc is None or ev in s.seen:
                          continue
                      s.seen.add(ev)
                      s.push(world, sc)

              def push(s, world, sc):
                  if sc.get('chapter'):
                      s.banner = [sc['chapter'], 3.2]
                  lines = [{'who': w, 'text': t, 'then': None}
                           for (w, t) in sc['lines'] if w in ('N', 'B') or w in world.players]
                  then = sc.get('then')
                  if lines:
                      lines[-1]['then'] = then
                      s.queue.extend(lines)
                  elif then:
                      s.finish(then)

              def bark(self, world):
                  if self.cur is not None or self.queue or random.random() > 0.5:
                      return
                  alive = [k for k, p in world.players.items() if p.alive]
                  if not alive:
                      return
                  self.queue.append({'who': random.choice(alive),
                                     'text': random.choice(BARKS_DOWN), 'then': None})

              def finish(s, then):
                  if then == 'wake' and s.is_host and s.world is not None:
                      s.world.begin_boss()

              # ----- per frame -----
              def update(s, dt):
                  if s.banner:
                      s.banner[1] -= dt
                      if s.banner[1] <= 0:
                          s.banner = None
                  if s.cur is None:
                      if s.queue:
                          s.cur = s.queue.pop(0)
                          s.shown = 0.0
                          s.hold = 0.0
                      return
                  n = len(s.cur['text'])
                  if s.shown < n:
                      s.shown = min(float(n), s.shown + s.CPS * dt)
                  else:
                      s.hold += dt
                      if s.hold > 1.8 + n * 0.02:
                          s.next()

              def next(s):
                  then = s.cur.get('then') if s.cur else None
                  s.cur = None
                  if then:
                      s.finish(then)

              def tap(s):
                  """returns True if the tap was used by the dialogue"""
                  if s.cur is None:
                      return False
                  if s.shown < len(s.cur['text']):
                      s.shown = float(len(s.cur['text']))
                  else:
                      s.next()
                  return True

              def skip_all(s):
                  while s.cur is not None or s.queue:
                      if s.cur is None:
                          s.cur = s.queue.pop(0)
                      s.next()
                  s.banner = None

              def busy(s):
                  return s.cur is not None or bool(s.queue)

              def visible(s):
                  """None or dict: name, color (key of PCOL), text (typed so far), portrait (SPR key or None), done"""
                  if s.cur is None:
                      return None
                  who = s.cur['who']
                  name, col = SPEAKERS[who]
                  if who == 'B':
                      port = 'boss_L'
                  elif who == 'N':
                      port = None
                  else:
                      port = 'hero%d_idle_R' % who
                  full = s.cur['text']
                  n = int(s.shown)
                  return {'name': name, 'color': col, 'text': full[:n], 'portrait': port,
                          'done': n >= len(full)}

          # ---------- (PART 6 continues below) ----------
          # ===================== PART 6: UI, rendering, main loop =====================
          from kivy.core.text import Label as CoreLabel
          from kivy.graphics import RoundedRectangle, BlendFunc

          CAM_Y = LEVEL_H * TILE - VIEW_H          # vertical camera offset (level is 192px tall)
          TXT_COL = {'w': (1, 1, 1), 'y': (1, 0.88, 0.29), 'r': (1, 0.27, 0.24), 'g': (0.48, 1, 0.78)}

          def c3(rgb, a=1.0):
              return (rgb[0] / 255.0, rgb[1] / 255.0, rgb[2] / 255.0, a)

          class Game(Widget):
              def __init__(s, **kw):
                  Widget.__init__(s, **kw)
                  s.scr = 'menu'                   # menu | host | join | game
                  s.world = None
                  s.story = None
                  s.btns = []
                  s.touches = {}
                  s.ip = '192.168.43.1'
                  s.lc = {}
                  s.cam = 0.0
                  s.sc = 4
                  s.ox = s.oy = 0
                  s.shx = s.shy = 0
                  s.toast = None
                  s.dlg_key = None
                  s.dlg_tex = None
                  s.t = 0.0
                  Window.bind(on_keyboard=s.on_key)
                  Clock.schedule_interval(s.loop, 1.0 / 60.0)

              # ---------- navigation ----------
              def on_key(s, win, key, *a):
                  if key == 27:                    # Android back button
                      if s.scr == 'menu':
                          return False
                      s.go_menu()
                      return True
                  return False

              def go_menu(s):
                  NET.stop()
                  s.world = None
                  s.story = None
                  s.scr = 'menu'
                  s.touches.clear()

              def begin_game(s):
                  w = World(NET.seed)
                  if NET.role == 'host':
                      for slot in sorted(NET.names):
                          w.add_player(slot, SPEAKERS[slot][0], own=(slot == 0))
                  s.world = w
                  s.story = Story(NET.role == 'host')
                  s.scr = 'game'
                  s.cam = 0.0
                  s.dlg_key = None
                  s.touches.clear()

              def press(s, n):
                  if n == 'host':
                      NET.host_start('Merlo')
                      s.scr = 'host'
                  elif n == 'join':
                      NET.stop()
                      s.scr = 'join'
                  elif n == 'connect':
                      NET.join(s.ip, 'Hero')
                  elif n == 'start':
                      if NET.status == 'hosting':
                          NET.start_game()
                          s.begin_game()
                  elif n in ('back', 'menu'):
                      s.go_menu()
                  elif n == 'quit':
                      App.get_running_app().stop()
                  elif n.startswith('k'):
                      ch = n[1:]
                      if ch == 'del':
                          s.ip = s.ip[:-1]
                      elif len(s.ip) < 15:
                          s.ip += ch

              # ---------- touch ----------
              def ctl_rects(s):
                  W, H = Window.size
                  u = H / 9.0
                  b = 1.9 * u
                  return [('L', 0.4 * u, 0.4 * u, b, b, '<'),
                          ('R', 0.7 * u + b, 0.4 * u, b, b, '>'),
                          ('A', W - 0.4 * u - b, 0.4 * u, b, b, 'FIRE'),
                          ('J', W - 0.7 * u - 2 * b, 0.4 * u, b, b, 'JUMP'),
                          ('S', W - 0.55 * u - 1.5 * b, 0.7 * u + b, b, b, 'NOVA')]

              def on_ctl(s, x, y):
                  for name, rx, ry, rw, rh, lab in s.ctl_rects():
                      if rx - 10 <= x <= rx + rw + 10 and ry - 10 <= y <= ry + rh + 10:
                          return name
                  return None

              def pressed(s):
                  pr = set()
                  for (x, y) in s.touches.values():
                      n = s.on_ctl(x, y)
                      if n:
                          pr.add(n)
                  return pr

              def on_touch_down(s, t):
                  s.touches[t.uid] = (t.x, t.y)
                  for name, x, y, w, h in s.btns:
                      if x <= t.x <= x + w and y <= t.y <= y + h:
                          s.press(name)
                          return True
                  if s.scr == 'game' and s.story is not None and not s.on_ctl(t.x, t.y):
                      s.story.tap()
                  return True

              def on_touch_move(s, t):
                  if t.uid in s.touches:
                      s.touches[t.uid] = (t.x, t.y)
                  return True

              def on_touch_up(s, t):
                  s.touches.pop(t.uid, None)
                  return True

              # ---------- text / shape helpers ----------
              def tex(s, text, size, bold=False, width=None):
                  size = int(max(8, size))
                  k = (text, size, bold, width)
                  t = s.lc.get(k)
                  if t is None:
                      if len(s.lc) > 500:
                          s.lc.clear()
                      lb = CoreLabel(text=text, font_size=size, bold=bold,
                                     text_size=(width, None) if width else (None, None))
                      lb.refresh()
                      t = lb.texture
                      s.lc[k] = t
                  return t

              def txt(s, text, x, y, size, col=(1, 1, 1, 1), al='c', bold=False, shadow=True):
                  if not text:
                      return
                  t = s.tex(text, size, bold)
                  w, h = t.size
                  px = x - w / 2.0 if al == 'c' else (x if al == 'l' else x - w)
                  py = y - h / 2.0
                  if shadow:
                      Color(0, 0, 0, col[3] * 0.8)
                      Rectangle(texture=t, pos=(px + 2, py - 2), size=(w, h))
                  Color(*col)
                  Rectangle(texture=t, pos=(px, py), size=(w, h))

              def box(s, x, y, w, h, col, r=0):
                  Color(*col)
                  if r:
                      RoundedRectangle(pos=(x, y), size=(w, h), radius=[r])
                  else:
                      Rectangle(pos=(x, y), size=(w, h))

              def button(s, name, label, x, y, w, h, col=(0.15, 0.6, 0.75, 1), size=None):
                  s.btns.append((name, x, y, w, h))
                  u = Window.height / 9.0
                  s.box(x, y, w, h, (0, 0, 0, 0.6), u * 0.16)
                  s.box(x + 3, y + 3, w - 6, h - 6, col, u * 0.12)
                  s.txt(label, x + w / 2, y + h / 2, size or u * 0.55, (1, 1, 1, 1), 'c', True)

              def spr_scr(s, key, x, y, w, h, a=1.0):
                  t = SPR.get(key)
                  if t is None:
                      return
                  Color(1, 1, 1, a)
                  Rectangle(texture=t, pos=(x, y), size=(w, h))

              def gx(s, x):
                  return s.ox + (round(x - s.cam) + s.shx) * s.sc

              def gy(s, y, h):
                  return s.oy + (VIEW_H - round(y - CAM_Y) - h + s.shy) * s.sc

              def spr(s, key, x, y, w, h, a=1.0):
                  t = SPR.get(key)
                  if t is None:
                      return
                  Color(1, 1, 1, a)
                  Rectangle(texture=t, pos=(s.gx(x), s.gy(y, h)), size=(w * s.sc, h * s.sc))

              # ---------- screens ----------
              def bg_menu(s):
                  W, H = Window.size
                  Color(1, 1, 1, 1)
                  Rectangle(texture=SPR['bg_far'], pos=(0, 0), size=(W, H))
                  Rectangle(texture=SPR['bg_mid'], pos=(0, 0), size=(W, H))
                  s.box(0, 0, W, H, (0, 0, 0, 0.35))

              def draw_menu(s):
                  W, H = Window.size
                  u = H / 9.0
                  s.bg_menu()
                  s.txt('PIXEL RIFT', W / 2, 7.4 * u, u * 1.7, (0.48, 1, 0.78, 1), 'c', True)
                  s.txt('A 4-player co-op adventure over local Wi-Fi', W / 2, 6.45 * u, u * 0.4, (1, 1, 1, 1))
                  for i in range(4):
                      bob = 0.12 * u * math.sin(s.t * 3 + i)
                      s.spr_scr('hero%d_idle_R' % i, W / 2 + (i - 2) * 1.7 * u + 0.35 * u,
                                4.6 * u + bob, 1.2 * u, 1.6 * u)
                  s.button('host', 'HOST GAME', W / 2 - 3 * u, 2.9 * u, 6 * u, 1.3 * u)
                  s.button('join', 'JOIN GAME', W / 2 - 3 * u, 1.4 * u, 6 * u, 1.3 * u, (0.5, 0.3, 0.8, 1))
                  s.button('quit', 'QUIT', W - 3.2 * u, 0.3 * u, 2.8 * u, 1.0 * u, (0.6, 0.2, 0.25, 1), u * 0.4)

              def draw_host(s):
                  W, H = Window.size
                  u = H / 9.0
                  s.bg_menu()
                  s.txt('HOST GAME', W / 2, 8.0 * u, u * 0.85, (0.48, 1, 0.78, 1), 'c', True)
                  if NET.status == 'failed':
                      s.txt(NET.msg, W / 2, 5.5 * u, u * 0.45, (1, 0.3, 0.3, 1))
                  else:
                      s.txt('Tell the others to tap JOIN and type this address:', W / 2, 6.8 * u, u * 0.42)
                      s.txt(NET.ip, W / 2, 5.5 * u, u * 1.5, (1, 0.88, 0.29, 1), 'c', True)
                      s.txt('Players connected: %d / %d' % (NET.count(), MAX_PLAYERS),
                            W / 2, 4.4 * u, u * 0.42, (1, 1, 1, 1))
                      for i, slot in enumerate(sorted(NET.names)):
                          nm = SPEAKERS[slot][0] + ('  (you - host)' if slot == 0 else '  (%s)' % NET.names[slot])
                          s.txt(nm, W / 2, (3.8 - i * 0.5) * u, u * 0.4, c3(PCOL[SLOT_COL[slot]]), 'c', True)
                  s.button('start', 'START', W / 2 - 3 * u, 0.5 * u, 6 * u, 1.4 * u,
                           (0.2, 0.7, 0.3, 1) if NET.status == 'hosting' else (0.3, 0.3, 0.3, 1))
                  s.button('back', 'BACK', 0.5 * u, 0.5 * u, 3 * u, 1.2 * u, (0.6, 0.2, 0.25, 1), u * 0.45)

              def draw_join(s):
                  W, H = Window.size
                  u = H / 9.0
                  s.bg_menu()
                  s.txt('JOIN GAME', 0.8 * u, H - 0.9 * u, u * 0.8, (0.48, 1, 0.78, 1), 'l', True)
                  s.txt('Host address (shown on the host phone):', 0.8 * u, H - 2.0 * u, u * 0.4, (1, 1, 1, 1), 'l')
                  bw = min(W * 0.5, 11 * u)
                  s.box(0.8 * u, H - 3.7 * u, bw, 1.4 * u, (0, 0, 0, 0.7), u * 0.15)
                  cur = '_' if int(s.t * 2) % 2 == 0 else ' '
                  s.txt(s.ip + cur, 1.1 * u, H - 3.0 * u, u * 0.9, (1, 0.88, 0.29, 1), 'l', True)
                  col = (1, 0.3, 0.3, 1) if NET.status in ('failed', 'lost') else (1, 1, 1, 1)
                  s.txt(NET.msg or 'Hotspot host? Usually 192.168.43.1', 0.8 * u, H - 4.5 * u, u * 0.38, col, 'l')
                  s.button('connect', 'CONNECT', 0.8 * u, 2.6 * u, 6 * u, 1.5 * u, (0.2, 0.7, 0.3, 1))
                  s.button('back', 'BACK', 0.8 * u, 0.5 * u, 3 * u, 1.2 * u, (0.6, 0.2, 0.25, 1), u * 0.45)
                  ks, gap = 1.6 * u, 0.15 * u
                  kx0 = W - 3 * (ks + gap) - 0.5 * u
                  rows = [['1', '2', '3'], ['4', '5', '6'], ['7', '8', '9'], ['.', '0', 'del']]
                  for r, row in enumerate(rows):
                      for c, k in enumerate(row):
                          s.button('k' + k, 'DEL' if k == 'del' else k, kx0 + c * (ks + gap),
                                   H - 1.0 * u - ks - r * (ks + gap), ks, ks, (0.25, 0.25, 0.4, 1), u * 0.6)

              # ---------- game ----------
              def draw_world(s):
                  w = s.world
                  sc = s.sc
                  W, H = Window.size
                  for key, par in (('bg_far', 0.12), ('bg_mid', 0.4)):
                      off = int(s.cam * par) % VIEW_W
                      Color(1, 1, 1, 1)
                      for k in (0, 1):
                          Rectangle(texture=SPR[key], pos=(s.ox + (k * VIEW_W - off) * sc, s.oy),
                                    size=(VIEW_W * sc, VIEW_H * sc))
                  t0 = max(0, int(s.cam // TILE) - 1)
                  t1 = min(LEVEL_W, int((s.cam + VIEW_W) // TILE) + 2)
                  Color(1, 1, 1, 1)
                  for ty in range(LEVEL_H):
                      for tx in range(t0, t1):
                          k = w.tile_key(tx, ty)
                          if k:
                              Rectangle(texture=SPR[k], pos=(s.gx(tx * TILE), s.gy(ty * TILE, TILE)),
                                        size=(TILE * sc, TILE * sc))
                  for key, x, y, ww, hh, a in w.sprites(s.cam):
                      s.spr(key, x, y, ww, hh, a)
                  BlendFunc(sfactor='src_alpha', dfactor='one')
                  for key, x, y in w.lights(s.cam):
                      s.spr(key, x - 16, y - 16, 32, 32, 0.9)
                  BlendFunc(sfactor='src_alpha', dfactor='one_minus_src_alpha')
                  for x, y, vx, vy, life, col in w.parts:
                      Color(*c3(PCOL.get(col, PCOL['white']), min(1.0, life * 3)))
                      Rectangle(pos=(s.gx(x), s.gy(y, 2)), size=(2 * sc, 2 * sc))
                  for x, y, bw, fr, key, name in w.bars(s.cam):
                      px, py = s.gx(x), s.gy(y, 2)
                      if px < -50 or px > W + 50:
                          continue
                      Color(0, 0, 0, 0.8)
                      Rectangle(pos=(px - 1, py - 1), size=(bw * sc + 2, 2 * sc + 2))
                      col = (1, 0.2, 0.2, 1) if key == 'r' else c3(PCOL[SLOT_COL[int(key[1])]])
                      Color(*col)
                      Rectangle(pos=(px, py), size=(max(0.0, bw * fr) * sc, 2 * sc))
                      if name:
                          s.txt(name, px + bw * sc / 2, py + 4 * sc, sc * 2.6, col)
                  for x, y, val, code, life in w.texts:
                      c = TXT_COL.get(code, (1, 1, 1))
                      size = sc * (4.6 if code == 'y' else 3.4)
                      s.txt(val, s.gx(x), s.gy(y, 0), size, (c[0], c[1], c[2], min(1.0, life * 2)), 'c', True)
                  # hide everything outside the pixel view
                  Color(0, 0, 0, 1)
                  Rectangle(pos=(0, 0), size=(s.ox, H))
                  Rectangle(pos=(s.ox + VIEW_W * sc, 0), size=(W - s.ox - VIEW_W * sc + 1, H))
                  Rectangle(pos=(0, 0), size=(W, s.oy))
                  Rectangle(pos=(0, s.oy + VIEW_H * sc), size=(W, H - s.oy - VIEW_H * sc + 1))

              def draw_controls(s, pr):
                  u = Window.height / 9.0
                  for name, x, y, w, h, lab in s.ctl_rects():
                      s.box(x, y, w, h, (1, 1, 1, 0.38 if name in pr else 0.15), u * 0.3)
                      s.txt(lab, x + w / 2, y + h / 2, u * (0.8 if len(lab) < 2 else 0.4),
                            (1, 1, 1, 0.9), 'c', True)

              def draw_hud(s):
                  w = s.world
                  W, H = Window.size
                  u = H / 9.0
                  pw = W / 4.0
                  for slot in range(MAX_PLAYERS):
                      p = w.players.get(slot)
                      if p is None:
                          continue
                      x, y = slot * pw + 0.1 * u, H - 1.5 * u
                      col = c3(PCOL[SLOT_COL[slot]])
                      s.box(x, y, pw - 0.2 * u, 1.4 * u, col[:3] + (0.9,), u * 0.15)
                      s.box(x + 3, y + 3, pw - 0.2 * u - 6, 1.4 * u - 6, (0.04, 0.05, 0.12, 0.85), u * 0.12)
                      s.spr_scr('hero%d_idle_R' % slot, x + 0.2 * u, y + 0.12 * u, 0.9 * u, 1.2 * u,
                                1.0 if p.alive else 0.35)
                      bx, bw = x + 1.3 * u, pw - 1.7 * u
                      s.txt(p.name, bx, y + 1.12 * u, u * 0.36, col, 'l', True)
                      fr = clamp(p.hp / float(max(1, p.mhp)), 0.0, 1.0)
                      s.box(bx, y + 0.62 * u, bw, 0.24 * u, (0, 0, 0, 0.9))
                      s.box(bx, y + 0.62 * u, bw * fr, 0.24 * u, (0.9, 0.2, 0.2, 1))
                      s.txt('%d/%d' % (p.hp, p.mhp), bx + bw / 2, y + 0.74 * u, u * 0.2, (1, 1, 1, 1), 'c', False, False)
                      s.box(bx, y + 0.4 * u, bw, 0.14 * u, (0, 0, 0, 0.9))
                      s.box(bx, y + 0.4 * u, bw * clamp(p.mana / 100.0, 0.0, 1.0), 0.14 * u, (0.3, 0.7, 1, 1))
                      s.txt('%d' % p.coins, bx, y + 0.17 * u, u * 0.28, (1, 0.88, 0.29, 1), 'l', True)
                      if not p.alive:
                          s.txt('DOWN', x + pw / 2 - 0.1 * u, y + 0.7 * u, u * 0.6, (1, 0.3, 0.3, 1), 'c', True)
                  b = w.boss
                  if b is not None and b.awake and b.alive:
                      bx, by, bw, bh = max(0, s.ox) + 0.3 * u, 3.0 * u, 0.55 * u, 3.9 * u
                      s.box(bx - 4, by - 4, bw + 8, bh + 8, (0.55, 0.35, 0.1, 1), u * 0.12)
                      s.box(bx, by, bw, bh, (0.1, 0.02, 0.03, 1))
                      s.box(bx, by, bw, bh * clamp(b.hp / float(max(1, b.mhp)), 0.0, 1.0), (0.85, 0.1, 0.1, 1))
                      s.txt('THORNROOT', bx + bw / 2 + 0.4 * u, by + bh + 0.3 * u, u * 0.28, (1, 0.6, 0.3, 1), 'l', True)

              def draw_dialogue(s):
                  d = s.story.visible()
                  W, H = Window.size
                  u = H / 9.0
                  st = s.story
                  if d:
                      bx, bw, by, bh = 4.8 * u, W - 9.6 * u, 0.3 * u, 2.6 * u
                      col = c3(PCOL[d['color']])
                      s.box(bx - 3, by - 3, bw + 6, bh + 6, col, u * 0.2)
                      s.box(bx, by, bw, bh, (0.05, 0.04, 0.12, 0.92), u * 0.18)
                      tx = bx + 0.4 * u
                      if d['portrait']:
                          ph = 1.9 * u
                          pw2 = ph if d['portrait'].startswith('boss') else ph * 0.75
                          s.spr_scr(d['portrait'], bx + 0.3 * u, by + 0.35 * u, pw2, ph)
                          tx = bx + 2.5 * u
                      s.txt(d['name'], tx, by + bh - 0.45 * u, u * 0.45, col, 'l', True)
                      wd = int(bx + bw - tx - 0.3 * u)
                      key = (d['text'], wd)
                      if key != s.dlg_key:
                          lb = CoreLabel(text=d['text'] or ' ', font_size=int(u * 0.4),
                                         text_size=(wd, None), halign='left')
                          lb.refresh()
                          s.dlg_tex = lb.texture
                          s.dlg_key = key
                      t = s.dlg_tex
                      Color(1, 1, 1, 1)
                      Rectangle(texture=t, pos=(tx, by + bh - 0.85 * u - t.height), size=t.size)
                      if d['done']:
                          s.txt('>>', bx + bw - 0.5 * u, by + 0.4 * u, u * 0.4, (1, 1, 1, 0.6 + 0.4 * math.sin(s.t * 8)))
                  if st.banner:
                      a = min(1.0, st.banner[1])
                      s.box(0, H * 0.62 - 0.8 * u, W, 1.6 * u, (0, 0, 0, 0.55 * a))
                      s.txt(st.banner[0], W / 2, H * 0.62, u * 0.75, (1, 0.88, 0.4, a), 'c', True)

              def draw_end(s, title, col):
                  W, H = Window.size
                  u = H / 9.0
                  s.box(0, 0, W, H, (0, 0, 0, 0.65))
                  s.txt(title, W / 2, H * 0.64, u * 1.7, col, 'c', True)
                  coins = sum(p.coins for p in s.world.players.values())
                  s.txt('Team coins: %d' % coins, W / 2, H * 0.48, u * 0.5, (1, 0.88, 0.29, 1))
                  s.button('menu', 'MAIN MENU', W / 2 - 3 * u, H * 0.25, 6 * u, 1.4 * u)

              def draw_game(s):
                  w = s.world
                  W, H = Window.size
                  u = H / 9.0
                  s.draw_world()
                  s.draw_controls(s.pressed())
                  s.draw_hud()
                  if s.toast:
                      s.txt(s.toast[0], W / 2, H - 2.1 * u, u * 0.45, (1, 0.8, 0.3, min(1.0, s.toast[1])), 'c', True)
                  s.draw_dialogue()
                  if NET.role == 'client' and NET.status in ('lost', 'failed'):
                      s.draw_end('CONNECTION LOST', (1, 0.4, 0.3, 1))
                  elif w.over and not s.story.busy():
                      if w.over == 'won':
                          s.draw_end('VICTORY!', (0.48, 1, 0.78, 1))
                      else:
                          s.draw_end('DEFEAT', (1, 0.3, 0.3, 1))

              def draw(s):
                  W, H = Window.size
                  s.sc = max(1, int(min(W / float(VIEW_W), H / float(VIEW_H))))
                  s.ox = int((W - VIEW_W * s.sc) / 2)
                  s.oy = int((H - VIEW_H * s.sc) / 2)
                  s.btns = []
                  s.canvas.clear()
                  with s.canvas:
                      if s.scr == 'game' and s.world is not None:
                          s.draw_game()
                      elif s.scr == 'host':
                          s.draw_host()
                      elif s.scr == 'join':
                          s.draw_join()
                      else:
                          s.draw_menu()

              # ---------- main loop ----------
              def step_game(s, dt):
                  w, st = s.world, s.story
                  host = NET.role == 'host'
                  for slot, p in w.players.items():
                      p.name = SPEAKERS[slot][0]
                  me = w.local_player()
                  if me is not None:
                      pr = s.pressed()
                      me.inp = {'l': 'L' in pr, 'r': 'R' in pr, 'j': 'J' in pr,
                                'a': 'A' in pr, 's': 'S' in pr}
                  if host:
                      w.update(dt)
                      if not NET.clients:
                          w.out = []
                  else:
                      w.update_client(dt)
                  NET.tick(w, dt)
                  st.feed(w)
                  st.update(dt)
                  tgt = me if (me is not None and me.alive) else None
                  if tgt is None:
                      al = [p for p in w.players.values() if p.alive]
                      tgt = al[0] if al else None
                  if tgt is not None:
                      lo = w.lock_tx * TILE if w.lock_tx else 0
                      want = clamp(tgt.x + 4 - VIEW_W / 2.0, lo, LEVEL_W * TILE - VIEW_W)
                      if s.cam == 0.0 and s.t < 1e9 and abs(want - s.cam) > 200:
                          s.cam = want
                      s.cam += (want - s.cam) * min(1.0, dt * 6)
                  if w.shake > 0:
                      k = int(min(3, 1 + w.shake * 0.4))
                      s.shx, s.shy = random.randint(-k, k), random.randint(-k, k)
                  else:
                      s.shx = s.shy = 0

              def loop(s, dt):
                  dt = min(dt, 0.1)
                  s.t += dt
                  NET.poll(s.world if s.scr == 'game' else None)
                  if s.toast:
                      s.toast[1] -= dt
                      if s.toast[1] <= 0:
                          s.toast = None
                  while NET.events:
                      ev = NET.events.pop(0)
                      if ev.startswith('left:'):
                          s.toast = [ev[5:] + ' left the game', 3.0]
                  if s.scr == 'join' and NET.started and NET.status == 'connected':
                      s.begin_game()
                  if s.scr == 'game' and s.world is not None:
                      s.step_game(dt)
                  s.draw()

          class PixelRiftApp(App):
              title = 'Pixel Rift'
              def build(s):
                  Window.clearcolor = (0, 0, 0, 1)
                  build_sprites()
                  return Game()
              def on_pause(s):
                  return True
              def on_stop(s):
                  NET.stop()

          if __name__ == '__main__':
              PixelRiftApp().run()
          # ===================== END OF main.py =====================
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev build-essential ccache cmake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            game/.buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('game/buildozer.spec') }}-v1

      - name: Build APK
        working-directory: game
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelRift-APK
          path: game/bin/*.apk
